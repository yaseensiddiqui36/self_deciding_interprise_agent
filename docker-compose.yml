services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    command: uv run uvicorn infinite_coding_round.api.main:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      AGENT_API_URL: http://backend:8000
      AGENT_MODE: api
    depends_on:
      - backend
    command: uv run streamlit run src/infinite_coding_round/ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
